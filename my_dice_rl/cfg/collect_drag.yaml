# Independent hand-guided demonstrations; existing SpaceMouse data is preserved.
data_root: datasets/demonstrations_drag
task: gear_insertion
record_hz: 10.0
writer_queue_capacity: 20
save_width: 224
save_height: 224
save_raw_rgb: true
jpeg_quality: 95
max_age_s: 0.25
max_camera_skew_s: 0.06
min_free_gb: 5.0
min_episode_frames: 16
base_frame: panda_link0
ee_frame: panda_hand_tcp
wrist_topic: /wrist/d435i/color/image_raw
external_topic: /external/color/image_raw
target_topic: /dice_drag_collector/unused_target
robot_state_topic: /franka_robot_state_broadcaster/robot_state
gripper_topic: /panda_gripper/joint_states
teleop_topic: /dice_drag_collector/unused_teleop
teleop_enable_service: /panda_drag_controller/enable
register_hold_service: /dice_drag_collector/unused_hold
reset_service: /dice_drag_collector/unused_reset
recording_lock_service: /dice_drag_collector/unused_lock
gripper_joint_names:
- panda_finger_joint1
- panda_finger_joint2
camera_placement:
  wrist: D435i mounted on wrist
  external: Femto Bolt in front of robot; extrinsic calibration not yet supplied
collection_mode: kinesthetic
action_source: measured_eef_pose
controller_name: panda_drag_controller
controller_command_interface: effort
drag:
  heartbeat_topic: /panda_drag_controller/heartbeat
  state_topic: /panda_drag_controller/state
  max_joint_velocity: 2.0
  max_force_n: 40.0
  max_displacement_m: 0.5
reset:
  reference_file: cfg/drag_reset_pose.yaml
  command_topic: /cartesian_impedance_target
  controller_manager: /controller_manager
  controller_name: panda_cartesian_impedance_controller
  position_noise_m: 0.02  # 基坐标XYZ各自均匀±2cm
  rotation_noise_deg: 10.0  # 随机轴，总旋转角0–10度；不是每轴各10度
  clearance_m: 0.01
  linear_speed: 0.05
  angular_speed: 0.15
  linear_acceleration: 0.08
  angular_acceleration: 0.30
  max_distance_m: 0.5
  max_angle_rad: 1.3
  position_tolerance_m: 0.003
  orientation_tolerance_rad: 0.03
  tracking_position_error_m: 0.05
  tracking_orientation_error_rad: 0.5
  max_force_n: 20.0
  max_torque_nm: 8.0
  settle_s: 0.3
  timeout_s: 60.0
