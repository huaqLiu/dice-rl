schema: dice_gear_rl_config_v1
teacher_checkpoint: null
expert_dataset: datasets/processed/gear_insertion_drag_three_v1.zarr
rollout_root: datasets/rl_rollouts_three/real
execution_config: cfg/execute_rl_three.yaml
review_config: cfg/rl_review.yaml
device_lock: log_dir/rl/device.lock
data:
  allow_demo: false
model:
  action_dim: 9
  chunk_steps: 4
  hidden_dims:
  - 1024
  - 1024
  - 1024
  ensemble_size: 5
  target_subset: 2
  residual_limit:
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  - 0.05
  multi_z: 2
  bc_weight: 100.0
  filter_warmup: 500
  q_margin: 0.0
  self_imitation_weight: 0.0
  normalize_q: true
  retain_expert_bc: true
  td_loss: huber
reward:
  success: 1.0
  failure: 0.0
  timeout: 0.0
  step_penalty: 0.0
training:
  device: cuda:0
  seed: 42
  torch_threads: 2
  batch_size: 32
  encoding_batch_size: 8
  actor_lr: 0.0001
  critic_lr: 0.0003
  weight_decay: 1.0e-06
  actor_update_freq: 2
  critic_warmup: 1000
  grad_clip_norm: 1.0
  target_tau: 0.005
  gamma: 0.99
  total_updates: 100000
  updates_per_round: 1000
  min_online_chunks: 20
  min_new_episodes: 10
  poll_seconds: 2.0
  chunk_stride: 4
  checkpoint_every: 500
  replay_capacity: 10000
  expert_capacity: 10000
  expert_ratio: 0.5
  allow_expert_only: false
  output_root: log_dir/finetune/gear_dice_three
  initial_updates: 2000
  run_alias: log_dir/finetune/gear_dice_three/current
