# Draft RL execution settings; confirm cfg/rl_review.yaml before real deployment.
collector_config: collect.yaml
checkpoint: null
device: cuda:0
inference_backend: process
data_root: datasets/rl_rollouts
task: gear_insertion
control_hz: 50.0
max_age_s: 0.2
max_sensor_skew_s: 0.08
max_gripper_age_s: 0.15
control_timeout_s: 0.15
max_inference_latency_s: 0.3
max_plan_age_s: 0.7
max_episode_s: 30.0
min_free_gb: 5.0
controller_name: panda_cartesian_impedance_controller
controller_command_interface: effort
controller_service: /controller_manager/list_controllers
teleop_node: /dice_spacemouse_teleop
teleop_lock_service: /dice_spacemouse_teleop/policy_lock
handover_timeout_s: 2.0
max_linear_speed: 0.025
max_angular_speed: 0.15
max_position_error: 0.025
max_orientation_error: 0.25
max_goal_position_error: 0.04
max_goal_orientation_error: 0.4
max_translation_from_reset: 0.1
max_rotation_from_reset: 0.6
reset_drift_m: 0.005
reset_drift_rad: 0.05
max_force: 20.0
max_torque: 10.0
gripper_speed: 0.02
gripper_force: 10.0
grasp_threshold: 0.01
gripper_width_change: 0.005
gripper_min_interval_s: 0.3
gripper_timeout_s: 8.0
cancel_timeout_s: 2.0
deployment_review: cfg/rl_review.yaml
device_lock: log_dir/rl/device.lock
