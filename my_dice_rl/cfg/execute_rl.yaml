# Draft RL execution settings; confirm cfg/rl_review.yaml before real deployment.
collector_config: collect.yaml
checkpoint: null
device: cuda:0
inference_backend: process
data_root: datasets/rl_rollouts
task: gear_insertion
control_hz: 50.0
max_age_s: 0.2
max_sensor_skew_s: 0.08
max_gripper_age_s: 0.15
control_timeout_s: 0.15
max_inference_latency_s: 0.3
max_plan_age_s: 0.7
max_episode_s: 30.0
min_free_gb: 5.0
controller_name: panda_cartesian_impedance_controller
controller_command_interface: effort
controller_service: /controller_manager/list_controllers
teleop_node: /dice_spacemouse_teleop
teleop_lock_service: /dice_spacemouse_teleop/policy_lock
handover_timeout_s: 2.0
max_linear_speed: 0.025
max_angular_speed: 0.15
max_position_error: 0.1
max_orientation_error: 0.6
max_goal_position_error: 0.1
max_goal_orientation_error: 0.6
max_translation_from_reset: 0.5
max_rotation_from_reset: 1.0
reset_drift_m: 0.005
reset_drift_rad: 0.05
max_force: 20.0
max_torque: 10.0
gripper_speed: 0.02
gripper_force: 10.0
grasp_threshold: 0.01
gripper_width_change: 0.005
gripper_min_interval_s: 0.3
gripper_timeout_s: 8.0
cancel_timeout_s: 2.0
deployment_review: cfg/rl_review.yaml
device_lock: log_dir/rl/device.lock
# 仅按9且首次确认后启动，不会随窗口打开自动运动。
auto_cycle:
  success_z_m: 0.060  # 实际 panda_hand_tcp 相对 panda_link0 的 Z，严格小于
  linear_speed: 0.010
  angular_speed: 0.10
  linear_acceleration: 0.05
  angular_acceleration: 0.20
  max_distance_m: 0.25
  position_tolerance_m: 0.09
  orientation_tolerance_rad: 0.49
  tracking_position_error_m: 0.09
  tracking_orientation_error_rad: 0.49
  settle_s: 0.30
  motion_timeout_s: 45.0
  label_wait_timeout_s: 5.0
  max_episodes: 20
  batch_episodes: 10
  wait_for_training: true
  training_wait_timeout_s: 900.0
  poll_s: 2.0
  latest_policy_index: log_dir/finetune/gear_dice/20261101_190141_382874/latest_policy.json
orientation_constraint:
  mode: vertical_keep_yaw
  tool_z_sign: -1  # TCP Z 轴朝向 panda_link0 的 -Z
  translation_hold_tilt_rad: 0.03490658503988659  # 超过 2 度先纠正姿态
